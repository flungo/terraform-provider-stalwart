#
# Opt-in check that flags this repo (via an issue in its own repo) if a future
# flungo/github-workflows major bump ever leaves it pinning a frozen @vN. No
# credential needed. See flungo/github-workflows docs/runbooks/adopting-flungo-workflows.md.
name: flungo/github-workflows

on:
  schedule:
    - cron: '0 7 * * 1'   # weekly (Mon 07:00 UTC)
  workflow_dispatch:

jobs:
  flungo-workflows:
    permissions:
      contents: read
      issues: write
    uses: flungo/github-workflows/.github/workflows/flungo-workflows.yml@v2
