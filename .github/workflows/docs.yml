#
# Regenerates Terraform Registry documentation on every push to a non-main
# branch and commits it back, so contributors never need a local Terraform
# binary. Delegates to the shared flungo/github-workflows provider docs
# workflow (which runs tfplugindocs from this module's pinned version).
#
# On main, docs must already be committed (the docs-in-sync check in test.yml
# enforces this, and this workflow is skipped on main).
name: docs

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  terraform-provider-docs:
    permissions:
      contents: write
    uses: flungo/github-workflows/.github/workflows/terraform-provider-docs.yml@v2
