#
# Markdown link validation. The internal job (offline relative-link + anchor
# check) blocks on pull_request/push; the external job (online URL sweep) runs
# on schedule/workflow_dispatch and reports breakage via a single auto-updated
# issue. URLs that legitimately 403/404 while unauthenticated go in
# .lycheeignore. Delegates to the shared flungo/github-workflows markdown-links
# workflow. See flungo/github-workflows docs/runbooks/adopting-markdown-workflows.md.
name: Markdown links

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  markdown-links:
    permissions:
      contents: read
      issues: write
    uses: flungo/github-workflows/.github/workflows/markdown-links.yml@v2
    secrets:
      LYCHEE_GITHUB_TOKEN: ${{ secrets.LYCHEE_GITHUB_TOKEN }}
