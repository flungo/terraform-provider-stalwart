#
# Markdown style/structure linting via markdownlint-cli2. Rule configuration
# lives in .markdownlint-cli2.jsonc. Delegates to the shared
# flungo/github-workflows markdown-lint workflow. See flungo/github-workflows
# docs/runbooks/adopting-markdown-workflows.md.
name: Markdown lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  markdown-lint:
    uses: flungo/github-workflows/.github/workflows/markdown-lint.yml@v2
