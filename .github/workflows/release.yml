#
# Builds and publishes the provider to the Terraform and OpenTofu registries on
# a v* tag (or workflow_dispatch with a version). Delegates to the shared
# flungo/github-workflows provider release workflow; the GPG secrets sign the
# release (it is built unsigned when they are absent).
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v0.1.0)'
        required: true
        type: string

jobs:
  release:
    permissions:
      contents: write
    uses: flungo/github-workflows/.github/workflows/terraform-provider-release.yml@v1
    with:
      version: ${{ inputs.version }}
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}
